# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/dependabot-2.0.json
version: 2

# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
updates:
  - package-ecosystem: github-actions
    commit-message: { prefix: chore(gha) }
    directory: '/'
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ "*" ]
      security:
        applies-to: security-updates
        patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    commit-message: { prefix: chore(docker) }
    directories: [ "**/*" ]
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ "*" ]
      security:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7

{{- if .Values.routing.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "keel.server.fullname" . }}
  labels: {{- include "keel.server.labels" . | nindent 4 }}
  namespace: {{ include "keel.server.namespace" . }}
spec:
  {{- with .Values.routing.hostnames }}
  hostnames:
    {{- range . }}
    - {{ tpl . $ | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.routing.parentRefs }}
  parentRefs: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.routing.paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path }}
      {{- with .filters }}
      filters: {{ toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "keel.server.fullname" $ }}
          port: {{ .port }}
    {{- end }}
{{- end }}

apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "csp-reporter.fullname" . }}-test-connection"
  labels:
    {{- include "csp-reporter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ['wget']
      # stdout, because the root filesystem is read-only
      args: ['-O-', '{{ include "csp-reporter.fullname" . }}:{{ .Values.service.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  restartPolicy: Never

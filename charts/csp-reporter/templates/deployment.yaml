apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csp-reporter.fullname" . }}
  labels:
    {{- include "csp-reporter.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "csp-reporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "csp-reporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "csp-reporter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /* values reused from an older chart version have no http key */}}
          {{- $httpPort := (.Values.http | default dict).port | default 8080 | int }}
          command:
            - /usr/bin/service
          args:
            - {{ printf "--address=:%d" $httpPort | quote }}
            {{- range .Values.args }}
            {{- /* the reporter keeps the last address flag, which would bypass http.port */}}
            {{- if regexMatch "^--?address(=|$)" (toString .) }}
            {{- fail "args must not set the reporter address flag; set http.port instead" }}
            {{- end }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ (.Values.metrics | default dict).port | default 9200 }}
              protocol: TCP
          livenessProbe:
            {{- toYaml (.Values.livenessProbe | default (dict "tcpSocket" (dict "port" "http"))) | nindent 12 }}
          readinessProbe:
            {{- toYaml (.Values.readinessProbe | default (dict "tcpSocket" (dict "port" "http"))) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

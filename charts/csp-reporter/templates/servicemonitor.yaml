{{- /* values reused from an older chart version have no serviceMonitor key */ -}}
{{- $serviceMonitor := .Values.serviceMonitor | default dict }}
{{- if and $serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "csp-reporter.fullname" . }}
  labels:
    {{- include "csp-reporter.labels" . | nindent 4 }}
    {{- with $serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "csp-reporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      {{- with $serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}

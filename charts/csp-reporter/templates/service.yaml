apiVersion: v1
kind: Service
metadata:
  name: {{ include "csp-reporter.fullname" . }}
  labels:
    {{- include "csp-reporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if (.Values.serviceMonitor | default dict).enabled }}
    - port: {{ (.Values.metrics | default dict).port | default 9200 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "csp-reporter.selectorLabels" . | nindent 4 }}

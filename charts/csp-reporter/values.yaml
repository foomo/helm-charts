# Default values for csp-reporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount:     1

image:
  repository: foomo/csp-reporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag:        "1.3.0" # https://github.com/foomo/csp-reporter/tags

# Kubernetes args replace the image CMD, so a non-empty list also sets the command to /usr/bin/service.
# The reporter exits on unknown flags, so pass only flags the image tag defines.
# args:
#   - --prometheus-address=:9300
# -- Extra flags for the reporter binary
args: [ ]

imagePullSecrets: [ ]
nameOverride:     ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:   ""

podLabels: { }

podAnnotations: { }

podSecurityContext: { }
# fsGroup: 2000

securityContext: { }
  # capabilities:
  #   drop:
  #   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80

metrics:
  # -- Container port of the Prometheus metrics listener; when not 9200, also pass a matching prometheus-address flag in args
  port: 9200

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor and a metrics port on the Service (needs the ServiceMonitor CRD)
  enabled:          false
  # -- Additional ServiceMonitor labels, e.g. the label your Prometheus selects on
  additionalLabels: { }
  # -- ServiceMonitor scrape interval, Prometheus default when empty
  interval:         ""

# Defaults to a tcpSocket check on the http port, which works with every image tag.
# From 1.4.0 the metrics listener answers GET /healthz, for example:
# livenessProbe:
#   httpGet:
#     path: /healthz
#     port: metrics
# -- Liveness probe, tcpSocket on the http port when empty; a non-empty value replaces it and must include a handler
livenessProbe: { }
# -- Readiness probe, tcpSocket on the http port when empty; a non-empty value replaces it and must include a handler
readinessProbe: { }

ingress:
  enabled:   false
  className: ""
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path:     /
          pathType: ImplementationSpecific
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: { }
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled:                        false
  minReplicas:                    1
  maxReplicas:                    100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }

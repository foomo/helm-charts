# Default values for csp-reporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount:     1

image:
  repository: foomo/csp-reporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag:        "1.4.0" # https://github.com/foomo/csp-reporter/tags

# Since chart 3.0.0 the container listens on http.port (8080) as uid/gid 65532 with the hardened
# security contexts below; the Service still exposes port 80. To run as root on container port 80
# again, set the following; Helm merges these maps into the defaults, so an empty map keeps them.
# The result runs like 2.x but still renders the explicit command and its address flag:
# http:
#   port: 80
# podSecurityContext:
#   runAsUser: null
#   runAsGroup: null
#   runAsNonRoot: null
#   seccompProfile: null
# securityContext:
#   allowPrivilegeEscalation: null
#   readOnlyRootFilesystem: null
#   capabilities: null
# resources:
#   requests: null
#   limits: null

http:
  # -- Container port of the report listener, passed to the reporter as its address flag; the Service keeps service.port
  port: 8080

# The chart runs /usr/bin/service with --address=:<http.port> followed by these args.
# The reporter exits on unknown flags, so pass only flags the image tag defines.
# Setting the address flag here fails the render; set http.port instead.
# args:
#   - --site=prod=shop.example.com
#   - --site=stage=*.stage.shop.example.com
# -- Extra flags for the reporter binary
args: [ ]

imagePullSecrets: [ ]
nameOverride:     ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:   ""

podLabels: { }

podAnnotations: { }

podSecurityContext:
  # -- Run as user id
  runAsUser:      65532
  # -- Run as group id
  runAsGroup:     65532
  # -- Refuse to start the container as root
  runAsNonRoot:   true
  # -- Restrict the container's syscalls with seccomp
  seccompProfile: { type: RuntimeDefault }

# Container security context; the reporter writes no files and binds no privileged port.
securityContext:
  # -- Controls whether a process can gain more privileges than its parent process
  allowPrivilegeEscalation: false
  # -- Mounts the container's root filesystem as read-only
  readOnlyRootFilesystem:   true
  # -- Grant certain privileges to a process without granting all the privileges of the root user
  capabilities:             { drop: [ ALL ] }

service:
  type: ClusterIP
  port: 80

metrics:
  # -- Container port of the Prometheus metrics listener; when not 9200, also pass a matching prometheus-address flag in args
  port: 9200

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor and a metrics port on the Service (needs the ServiceMonitor CRD)
  enabled:          false
  # -- Additional ServiceMonitor labels, e.g. the label your Prometheus selects on
  additionalLabels: { }
  # -- ServiceMonitor scrape interval, Prometheus default when empty
  interval:         ""

# Defaults to a tcpSocket check on the http port, which works with every image tag.
# The metrics listener also answers GET /healthz, for example:
# livenessProbe:
#   httpGet:
#     path: /healthz
#     port: metrics
# -- Liveness probe, tcpSocket on the http port when empty; a non-empty value replaces it and must include a handler
livenessProbe: { }
# -- Readiness probe, tcpSocket on the http port when empty; a non-empty value replaces it and must include a handler
readinessProbe: { }

ingress:
  enabled:   false
  className: ""
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path:     /
          pathType: ImplementationSpecific
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Each concurrent report upload holds up to 1 MiB of body plus its decoded reports; raise the
# memory limit when report bursts get the container OOM-killed.
resources:
  requests:
    # -- CPU request
    cpu:    10m
    # -- Memory request
    memory: 64Mi
  limits:
    # -- Memory limit
    memory: 256Mi

autoscaling:
  enabled:                        false
  minReplicas:                    1
  maxReplicas:                    100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }
